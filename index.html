
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Grid Challenge</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="game">

    <div class="header">
        <div>
            <div class="logo">NUMBER<span>GRID</span></div>
            <div class="subtitle">NUMBER PUZZLE CHALLENGE</div>
        </div>

        <div class="mistake-box">
            MISTAKES
            <div class="dots">
                <i class="dot"></i>
                <i class="dot"></i>
                <i class="dot"></i>
            </div>
        </div>
    </div>

    <div class="divider"></div>

    <div class="instruction">
        Use each digit once per row and column · Move: WASD / Arrow Keys · Input: 1–5
    </div>

    <div class="grid" id="grid"></div>

    <div class="number-title">Select a number</div>

    <div class="numbers">
        <button class="key" data-n="1">1</button>
        <button class="key" data-n="2">2</button>
        <button class="key" data-n="3">3</button>
        <button class="key" data-n="4">4</button>
        <button class="key" data-n="5">5</button>
    </div>

    <div class="status" id="status">
        Select an empty square to begin.
    </div>

    <div class="timer-info">
        <span>TIME REMAINING</span>
        <span id="time">60.0s</span>
    </div>

    <div class="timer-bar">
        <div class="fill" id="fill"></div>
    </div>

    <button class="restart" id="restart">
        ↻ &nbsp; NEW GAME
    </button>

    <div class="footer">
        NUMBER GRID CHALLENGE · 5 × 5
    </div>

</div>

</body>
</html>
